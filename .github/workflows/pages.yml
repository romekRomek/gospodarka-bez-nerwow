name: Publikacja na GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment3.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Walidacja danych
        run: python3 scripts/validate.py
      - name: Testy walidatora
        run: python3 -m unittest discover -s tests
      - name: Kontrast tokenów
        run: python3 docs/design/tokens.py check
      - name: Design-lint
        run: python3 scripts/design-lint.py
      - run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Krok publikacji bywa nieudany z przejściowym błędem GitHuba („Found 0 artifacts”, artefakt wgrany w tym samym przebiegu
      # nie jest jeszcze widoczny). Ponawiamy go z przerwą, najwyżej dwa razy; trzecia próba decyduje o wyniku przebiegu.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Przerwa przed ponowieniem (1)
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Przerwa przed ponowieniem (2)
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 45
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
